name: Monitor licitaciones PLACSP

on:
  schedule:
    - cron: '47 19 * * *'   # 19:47 UTC = 21:47 hora España en verano (20:47 en invierno). Los feeds de PLACSP apenas reciben entradas entre las ~21:00 y las ~06:00, así que leer de noche ve el día completo. GitHub retrasa las programadas varias horas (en octubre de 2026, la de 03:08 UTC arrancaba hacia las 09-10 UTC); con esta hora se espera que los datos estén listos de madrugada. PRUEBA desde el 9/10/2026: si el retraso sigue siendo malo, volver a '30 1 * * *' (01:30 UTC). Minuto "no en punto" para evitar el pico de carga de las horas en punto
  workflow_dispatch:        # permite ejecución manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python fetch_licitaciones.py

      - name: Commit estado actualizado
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add filtros.json filtros/
          git diff --quiet --cached || git commit -m "Actualización diaria licitaciones $(date +%F)"
          # GitHub devuelve de vez en cuando un error 500 temporal al hacer push: se reintenta
          for intento in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push fallido (intento $intento de 5); reintentando en $((intento * 15)) s..."
            sleep $((intento * 15))
          done
          echo "No se pudo subir el resultado tras 5 intentos"
          exit 1
