name: Revision IA bajo demanda

# Lo lanza el visor (botón "Solicitar Revisión IA") mediante la API de GitHub. Genera el informe de
# una sola licitación y lo guarda en el histórico de todos los filtros donde aparece.
on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: "Expediente (folder_id) de la licitación a analizar"
        required: true
        type: string
      solicitante:
        description: "Nombre de quien pide la revisión (lo rellena el visor; opcional)"
        required: false
        default: ""
        type: string
      forzar:
        description: "Regenerar aunque ya exista un informe válido (solo al lanzarlo a mano desde Actions)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar el informe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOLVENCIA_EMPRESA: ${{ secrets.SOLVENCIA_EMPRESA }}
          FOLDER_ID: ${{ inputs.folder_id }}
          FORZAR: ${{ inputs.forzar }}
          SOLICITANTE: ${{ inputs.solicitante }}
        run: |
          OPCIONES=""
          if [ "$FORZAR" = "true" ]; then OPCIONES="--forzar"; fi
          python fetch_licitaciones.py --generar-revision "$FOLDER_ID" --salida "$RUNNER_TEMP/revision.json" --solicitante "$SOLICITANTE" $OPCIONES

      # El informe ya está generado; si el push falla porque otro proceso (el monitor diario, una
      # revisión marcada desde el visor...) escribió antes, se reaplica sobre la última versión del
      # repositorio sin volver a llamar a la IA.
      - name: Guardar el informe en el histórico
        env:
          FOLDER_ID: ${{ inputs.folder_id }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python fetch_licitaciones.py --aplicar-revision "$FOLDER_ID" --entrada "$RUNNER_TEMP/revision.json"
            git add filtros/
            if git diff --quiet --cached; then
              echo "Sin cambios que guardar."
              exit 0
            fi
            git commit -m "Revisión IA bajo demanda de $FOLDER_ID"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rechazado (intento $intento); se reintenta."
            sleep 5
          done
          exit 1
